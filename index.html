<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MagMotosRacing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Lilita+One&display=swap" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #1d1526;
  --panel: rgba(36,26,40,.88);
  --line: #54404a;
  --fg: #ffffff;
  --muted: #cdb8aa;
  --accent: #ffb703;
  --gold: #ffffff;   /* color del texto GAME OVER (también la barra de carga) */
  --font-title: "Luckiest Guy", Impact, "Arial Black", sans-serif;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Arial Black", sans-serif;
  --font-body: "Lilita One", "Arial Rounded MT Bold", "Arial Black", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body.pc { background: #000; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; touch-action: none; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
  font-synthesis: none;
  -webkit-user-select: none;
  user-select: none;
}
#stage { position: relative; width: 100%; height: 100%; outline: none; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #f2b684; }
#nogl { position: absolute; inset: 0; z-index: 60; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; color: var(--muted); }
#nogl p { margin: 0; max-width: 28em; font-size: 16px; line-height: 1.4; }

.hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 28px; background: linear-gradient(to bottom, rgba(40,20,40,.55), rgba(40,20,40,0)); pointer-events: none; }
.k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #ffffff; }
.v { font-family: var(--font-display); font-weight: 600; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(40,10,30,.55); }
.v small { font-size: 14px; font-weight: 600; color: #ffffff; margin-left: 3px; }

.btn {
  font: 600 13px/1 var(--font-body);
  color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 9px 12px; cursor: pointer; list-style: none;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.pad {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: flex-end; align-items: flex-end; gap: 12px;
  padding: 0 max(30px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(30px, env(safe-area-inset-left, 0px)); pointer-events: none;
}
.key {
  pointer-events: auto; touch-action: none; position: relative;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
  height: 96px; min-width: 84px; padding: 0 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  font: 600 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase;
  color: var(--fg); background: rgba(36,22,40,.62);
  border: 1px solid rgba(255,220,190,.35); border-radius: 10px;
}
.key svg { color: #ffffff; width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
/* Al tocar un botón NO cambia de color: se achica para mostrar que el dedo está encima */
.key { transition: transform .08s ease-out; }
.key.on { transform: scale(.86); }
.key.wide { min-width: 108px; }
@media (max-width: 520px) {
  .pad { gap: 8px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  .key { height: 84px; min-width: 0; width: 16vw; padding: 0 4px; }
  .key.wide { min-width: 0; width: 22vw; }
}

.right { display: flex; flex-direction: row; align-items: flex-end; gap: 14px; }
.gascol { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.speed { pointer-events: none; display: flex; flex-direction: column; align-items: center; }
.speed .v { font-size: 46px; line-height: 1; margin-top: 2px; }
.dial { width: 160px; height: auto; display: block; overflow: visible; }
.count { position: absolute; left: 50%; top: 24%; transform: translate(-50%, -50%); z-index: 7; display: none; pointer-events: none; font-family: var(--font-title); font-size: clamp(90px, 24vw, 200px); line-height: 1; color: var(--gold); text-shadow: 0 8px 0 #8a2b12, 0 12px 26px rgba(0,0,0,.5); text-align: center; }
.count.pop { animation: cpop 1s ease-out both; }
.count.goa { animation: cgo .65s ease-out both; color: #9dff9a; text-shadow: 0 8px 0 #1c5a22, 0 12px 26px rgba(0,0,0,.5); }
@keyframes cpop { 0% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(.85); opacity: .9; } }
@keyframes cgo { 0% { transform: translate(-50%, -50%) scale(.8); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

#end {
  position: absolute; inset: 0; z-index: 20; display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding: 24px; text-align: center;
  background: radial-gradient(ellipse at center, rgba(34,16,40,.55), rgba(34,16,40,.86));
}
#end.show { display: flex; animation: fadeIn .8s ease both; }
#end h1 { font-family: var(--font-title); font-weight: 700; font-size: clamp(58px, 15vw, 130px); line-height: .95; margin: 0; letter-spacing: .02em; text-transform: uppercase; color: #ffffff; text-shadow: 0 6px 0 #8a2b12, 0 12px 26px rgba(0,0,0,.55); }
#end #end-max { white-space: pre-line; font-family: var(--font-display); font-size: clamp(16px, 4.2vw, 24px); line-height: 1.4; letter-spacing: .04em; text-transform: uppercase; color: #ffffff; }
#rot { position: absolute; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 28px; text-align: center; background: #1b0f24; }
#rot.show { display: flex; }
#rot p { margin: 0; font-family: var(--font-display); font-size: clamp(20px, 4vw, 30px); line-height: 1.3; color: var(--gold); max-width: 22em; }
#rot small { display: block; margin-top: 10px; font-size: .6em; color: #cdb8aa; }
#again small { display: none; font-size: .8em; opacity: .75; }
@media (hover: hover) and (pointer: fine) { #again small { display: inline; } }
#end { overflow: auto; }
.qual { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; }
.qual .ql { font-family: var(--font-display); font-size: 16px; letter-spacing: .08em; color: #fff; margin-right: 4px; }
#end .qb { font: 600 14px/1 var(--font-body); padding: 9px 13px; border-radius: 6px; cursor: pointer; color: #fff; background: rgba(36,26,40,.72); border: 1px solid var(--line); }
#end .qb.on { background: var(--accent); color: #1a1405; border-color: var(--accent); }
#end .endwrap { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 100%; margin: auto; }
#end .endtxt { display: flex; flex-direction: column; align-items: center; gap: 12px; }
#end img.banner { display: block; width: auto; height: auto; max-width: 86vw; max-height: 46vh; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
@media (orientation: landscape) {
  #end .endwrap { flex-direction: row; gap: 36px; }
  #end img.banner { max-width: 40vw; max-height: 86vh; }
}
#end p { margin: 0; color: #f0dccd; font-size: 15px; }
#end .btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; }
#end .btn { font-size: 18px; padding: 10px 22px; background: var(--accent); color: #1a1405; border-color: var(--accent); font-weight: 600; }
.clock { position: absolute; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 6; text-align: center; }
#time { font-family: var(--font-display); font-size: 46px; line-height: 1; color: #ffffff; text-shadow: 0 3px 0 #7a2c10, 0 0 14px rgba(40,10,30,.6); font-variant-numeric: tabular-nums; min-width: 2ch; }
.clock.low #time { color: #ff4a36; animation: blink .5s steps(2, end) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.tm { position: relative; display: block; }
.bonus { position: absolute; left: 100%; top: 50%; margin-left: 10px; transform: translateY(-50%); font-family: var(--font-display); font-size: 34px; line-height: 1; white-space: nowrap; color: #7dff8a; text-shadow: 0 2px 0 #14451c; opacity: 0; }
.bonus.show { animation: bonusUp 1.6s ease-out both; }
@keyframes bonusUp { 0% { opacity: 0; transform: translate(-8px, -50%) scale(.7); } 12% { opacity: 1; transform: translate(0, -50%) scale(1.15); } 25% { transform: translate(0, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(0, -50%) scale(1); } }
@media (max-width: 640px) { .hud { padding-top: calc(76px + env(safe-area-inset-top, 0px)); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.wrenches { position: absolute; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 6; display: flex; align-items: center; gap: 8px; pointer-events: none; padding: 5px 12px 5px 8px; background: rgba(36,22,40,.55); border: 1px solid rgba(255,220,190,.3); border-radius: 10px; transform-origin: left center; }
.wrenches svg { width: 26px; height: 26px; display: block; }
.wrenches .n { font-family: var(--font-display); font-size: 30px; line-height: 1; color: #ffffff; text-shadow: 0 2px 0 #7a2c10; font-variant-numeric: tabular-nums; min-width: 1ch; }
.wrenches.pop { animation: wrenchpop .5s ease-out; }
@keyframes wrenchpop { 0% { transform: scale(1); } 35% { transform: scale(1.3); background: rgba(255,200,60,.45); } 100% { transform: scale(1); } }

/* El tacómetro siempre queda centrado arriba de Acelerar */
@media (max-width: 520px) {
  .right { gap: 8px; }
  .dial { width: min(160px, 30vw); }
}

/* Celular en vertical: las flechas ocupan todo el espacio libre; Frenar (del tamaño de una flecha de antes) queda pegado a Acelerar */
@media (hover: none) and (pointer: coarse) and (orientation: portrait) {
  .pad { justify-content: flex-end; gap: 8px; }
  .right { flex: 0 0 auto; gap: 3px; }
  .right > .key.wide, .gascol > .key.wide { width: clamp(64px, 16vw, 96px); min-width: 0; }
}

/* Celular en horizontal: HUD y botones más compactos para dejar libre la pista */
@media (hover: none) and (pointer: coarse) and (orientation: landscape) and (max-height: 540px) {
  .pad { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .key { height: 68px; min-width: 76px; width: auto; }
  .key.wide { min-width: 100px; width: auto; }
  .key svg { width: 22px; height: 22px; }
  .dial { width: 124px; }
  .speed .v { font-size: 30px; }
  #time { font-size: 34px; }
  .bonus { font-size: 26px; }
  .clock { top: calc(4px + env(safe-area-inset-top, 0px)); }
  .wrenches { top: calc(8px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); padding: 3px 10px 3px 6px; }
  .wrenches svg { width: 22px; height: 22px; }
  .wrenches .n { font-size: 24px; }
  .count { top: 30%; font-size: clamp(70px, 22vh, 130px); }
  #end h1 { font-size: clamp(36px, 14vh, 70px); }
}
/* Celular en horizontal: izquierda/derecha a la izquierda; frenar/acelerar a la derecha */
@media (hover: none) and (pointer: coarse) and (orientation: landscape) {
  .pad { justify-content: flex-end; }
  .right { display: contents; }
  .pad > .right > .key[data-act="right"] { margin-right: auto; }
}
/* Celular en vertical: flechas a la izquierda y separadas; Frenar + Acelerar pegados al borde derecho; Acelerar con el ancho del tacómetro */
@media (hover: none) and (pointer: coarse) and (orientation: portrait) {
  .pad { padding-left: 10vw; padding-right: 18px; }
  .pad > .right { width: 100%; gap: 0; justify-content: flex-start; }
  .pad > .right > .key[data-act="right"] { margin-left: 4vw; }
  .pad > .right > .key[data-act="brake"] { margin-left: auto; }
  .pad > .right > .gascol { margin-left: 3px; width: min(160px, 30vw); }
  .pad > .right > .gascol > .key.wide { width: 100%; }
}
.btn > span:first-child { display: block; line-height: 1; white-space: nowrap; }
/* Pausa: botón ⏸ arriba a la derecha (solo en carrera) y pantalla PAUSE con el mismo estilo que START */
.pbtn { position: absolute; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 8; display: none; align-items: center; justify-content: center; width: 48px; height: 44px; padding: 0; color: #ffffff; background: rgba(36,22,40,.55); border: 1px solid rgba(255,220,190,.3); border-radius: 10px; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; transition: transform .08s ease-out; }
.pbtn:active { transform: scale(.88); }
.pbtn svg { width: 24px; height: 24px; fill: currentColor; display: block; }
body.playing .pbtn { display: flex; }
#pause { position: absolute; inset: 0; z-index: 21; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: radial-gradient(ellipse at center, rgba(34,16,40,.45), rgba(34,16,40,.8)); }
#pause.show { display: flex; animation: fadeIn .25s ease both; }
#pause .btn { display: inline-flex; align-items: center; gap: 14px; font-family: var(--font-title); font-size: clamp(22px, 6vw, 32px); letter-spacing: .05em; padding: 12px 34px; background: var(--accent); color: #1a1405; border-color: var(--accent); }
@media (hover: none) and (pointer: coarse) and (orientation: landscape) and (max-height: 540px) { .pbtn { top: calc(8px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 44px; height: 38px; } }
/* Textos más chicos: número debajo del tacómetro y +15 */
.speed .v { font-size: 30px; }
.speed .v small { font-size: 11px; }
.bonus { font-size: 22px; }
@media (hover: none) and (pointer: coarse) and (orientation: landscape) and (max-height: 540px) { .speed .v { font-size: 24px; } .bonus { font-size: 20px; } }
/* PC: sin teclas en pantalla (queda el tacómetro) y "(Espacio)" visible en Retry */
body.pc .key[data-act] { display: none; }
#rain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: block; }
#flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
#flash i { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at 14% 6%, rgba(255,255,255,.95) 0%, rgba(228,236,255,.6) 40%, rgba(205,218,250,.28) 100%); }
#flash i.r { background: radial-gradient(ellipse at 86% 6%, rgba(255,255,255,.95) 0%, rgba(228,236,255,.6) 40%, rgba(205,218,250,.28) 100%); }
#flash.l i.l, #flash.r i.r { opacity: 1; }
/* Pantalla de carga: logo de MagMotos, barra con el color de GAME OVER y borde blanco, porcentaje chico al costado */
#load { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 5vh, 40px); padding: 24px; background: #000; transition: opacity .5s ease; }
#load .btn { display: none; align-items: center; gap: 14px; font-family: var(--font-title); font-size: clamp(22px, 6vw, 32px); letter-spacing: .05em; padding: 12px 34px; background: var(--accent); color: #1a1405; border-color: var(--accent); }
#load.done .ldrow { display: none; }   /* al llegar a 100 % se van la barra y el texto y queda START */
#load.done .btn { display: inline-flex; }
#load.out { opacity: 0; pointer-events: none; }
#load img { display: block; width: min(80vw, 560px); max-height: 45vh; object-fit: contain; }
.ldrow { position: relative; width: min(60vw, 420px); }
.ldbar { height: 22px; border: 3px solid #fff; border-radius: 12px; overflow: hidden; }
.ldbar i { display: block; width: 0; height: 100%; background: var(--gold); }
#ldtip { min-height: 2.6em; max-width: min(86vw, 520px); margin: 10px auto 0; text-align: center; font: 700 clamp(16px, 4vw, 19px)/1.3 Consolas, 'Lucida Console', 'Courier New', monospace; letter-spacing: .02em; color: #ffffff; cursor: pointer; padding: 6px 14px; user-select: none; -webkit-user-select: none; }
#ldtip.sw { animation: tipIn .25s ease both; }
#ldhint { margin: 0 auto; text-align: center; font: 400 clamp(11px, 2.8vw, 13px)/1.2 Consolas, 'Lucida Console', 'Courier New', monospace; color: #cfcfcf; opacity: .85; user-select: none; -webkit-user-select: none; }
@keyframes tipIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
#ldpct { position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%); font: 600 14px/1 var(--font-display); color: #fff; font-variant-numeric: tabular-nums; }
/* Textos del HUD más visibles (contorno oscuro). GAME OVER y los botones (flechas, Frenar, Acelerar) quedan como antes */
.k { -webkit-text-stroke: 2px rgba(20,10,30,.9); paint-order: stroke fill; }
.v, #time, .bonus, .wrenches .n, #ldpct { -webkit-text-stroke: 2px rgba(20,10,30,.9); paint-order: stroke fill; }
.v small { -webkit-text-stroke: 2px rgba(20,10,30,.9); }

#win { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: space-between; gap: 1.6vh; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: #000; color: #fff; text-align: center; overflow: hidden; cursor: pointer; }
#win.show { display: flex; animation: fadeIn .8s ease both; }
#win .wintitle { flex: 0 0 auto; margin: 0; max-width: 100%; white-space: nowrap; font-family: var(--font-title); font-weight: 700; font-size: min(14vw, 13vh); line-height: 1; letter-spacing: .02em; color: #fff; text-shadow: 0 0 18px rgba(255,201,51,.35), 0 3px 0 #7a5500; }
#win svg { flex: 1 1 0; min-height: 0; width: 100%; max-width: 92vw; filter: drop-shadow(0 0 22px rgba(255,201,51,.35)); }
#win .wintxt { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#win #wintip { margin: 0; min-height: 2.6em; max-width: min(90vw, 560px); display: flex; align-items: center; justify-content: center; font: 700 clamp(17px, 4.4vw, 24px)/1.3 Consolas, 'Lucida Console', 'Courier New', monospace; letter-spacing: .02em; color: #fff; }
#win #wintip.sw { animation: tipIn .25s ease both; }
#win .winhint { margin: 0; font: 400 clamp(11px, 2.8vw, 13px)/1.2 Consolas, 'Lucida Console', 'Courier New', monospace; color: #cfcfcf; opacity: .85; }
#win .wininsta { flex: 0 0 auto; margin: 0; font-family: var(--font-display); font-size: clamp(20px, 5.4vw, 32px); letter-spacing: .03em; color: #fff; }
@media (orientation: landscape) and (max-height: 520px) { #win { gap: .8vh; padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); } #win .wintitle { font-size: min(12vw, 15vh); } #win #wintip { min-height: 1.3em; font-size: clamp(13px, 3.6vh, 20px); } #win .wintxt { gap: 2px; } #win .wininsta { font-size: clamp(15px, 4.8vh, 26px); } }
</style>
</head>
<body>
<div id="stage" tabindex="0">
  <canvas id="cv" aria-label="Carrera de motos vista desde atrás"></canvas>
  <div id="nogl"><p id="nogl-t"></p><button class="btn" id="nogl-btn" type="button">Reintentar</button></div>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div id="flash" aria-hidden="true"><i class="l"></i><i class="r"></i></div>

  <div class="clock" id="clock"><span class="k">TIME</span><span class="tm"><span id="time">15</span><span class="bonus" id="bonus"></span></span></div>

  <div class="count" id="count" aria-hidden="true"></div>

  <div class="wrenches" id="wrenches" aria-label="Bujías recolectadas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(45 12 12)"><g transform="translate(12 21.6) scale(.55 -.55)" stroke="#2a2f38" stroke-linejoin="round" stroke-width="1.2"><rect x="-.6" y="-2" width="1.2" height="3.2" fill="#b0b6c0"/><rect x="-2.6" y="0" width="5.2" height="9" fill="#8a929e"/><rect x="-4.8" y="9" width="9.6" height="5" fill="#c6d2e2"/><rect x="-2.8" y="14" width="5.6" height="16" fill="#f2efe6"/><rect x="-3.7" y="18.2" width="7.4" height="1.2" fill="#f2efe6"/><rect x="-3.7" y="21.7" width="7.4" height="1.2" fill="#f2efe6"/><rect x="-3.7" y="25.2" width="7.4" height="1.2" fill="#f2efe6"/><rect x="-1.2" y="30" width="2.4" height="5" fill="#e0b030"/><circle cx="0" cy="36" r="1.9" fill="#e0b030"/></g></g></svg>
    <span class="n" id="wrenchn">0</span>
  </div>

  <button class="pbtn" id="pausebtn" type="button" aria-label="Pausa"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>

  <header class="hud">
  </header>

  <div class="pad">
    <div class="right">
      <button class="key wide" type="button" data-act="left" aria-label="Girar a la izquierda">

  var Loader = (function () {
    var root = document.getElementById('load'), fill = document.getElementById('ldfill'), pctEl = document.getElementById('ldpct');
    var W_FONT = 8, W_SND = 3, W_SFX = 3, W_GPU = 4, W_WORLD = 9, W_AI = 8, W_SCN = 5, W_TR = 5, W_END = 10;   /* peso de cada paso: 8 + 3 + 3 + 4 + 9 + 8 (IA de dificultad) + 5 escenarios × 5 + 6 transiciones × 5 + 10 = 100 */
    var LOAD_MIN_S = 7;   /* la barra tarda al menos 7 s en llegar al 100 %, aunque la carga real termine antes */
    var warmCp = null, done = false, real = 0, shown = 0, tStart = performance.now(), last = performance.now(), lastPct = -1, onDone = null;
    function noop() {}

    function tick(now) {
      var dt = Math.min(0.1, (now - last) / 1000), p;
      last = now;
      var kk = Math.min(1, (now - tStart) / (LOAD_MIN_S * 1000)), tgt = Math.min(real, 100 * (0.7 * kk + 0.3 * kk * kk * (3 - 2 * kk)));   /* tope de tiempo: sube parejo y sin saltos */
      shown = tgt - shown < 0.3 ? Math.max(shown, tgt) : shown + (tgt - shown) * Math.min(1, 5 * dt);
      p = Math.round(shown);
      if (p !== lastPct) { lastPct = p; pctEl.textContent = p + '%'; root.setAttribute('aria-valuenow', p); }
      fill.style.width = shown + '%';
      if (shown >= 100) finish(); else requestAnimationFrame(tick);
    }
    function finish() { done = true; Aud.release(); root.classList.add('done'); onDone(); }   /* al 100 %: se cancela cualquier tarea tardía y el audio vuelve a su volumen */

    /* sonidos: crea el contexto y decodifica cigarra.ogg */
    function startAudio() {
      Snd.init();
      if (!Aud.ctx) return Promise.resolve();
      var DIST = [0.2, 0.55, 0.9];   /* distancia de cada trueno grabado (cerca → lejos): define cuánto tarda en llegar después del relámpago */
      return Promise.all([Aud.decode(SND.cigarra).then(function (b) { Aud.buf.cigarra = b; }, noop)].concat(SND.trueno.map(function (u, i) {
        return Aud.decode(u).then(function (b) { b.dist = DIST[i]; (Aud.buf.trueno = Aud.buf.trueno || []).push(b); }, noop);
      })));
    }
    function sfx() {   /* precarga de TODOS los sonidos en mute: arma los nodos de cada efecto sin que se escuche nada */
      if (!Aud.ctx) return;
      Aud.hold();
      try { Snd.crash(); Snd.thud(1); Snd.lose(); Snd.service(); Snd.wrench(); Snd.beep(880, 0.1, 0, 'checkpoint');   /* precarga en un bus silenciado: si el contexto estaba suspendido, este pitido quedaba en cola y sonaba al reanudarse con el primer toque */ Snd.beep(1175, 0.09, 0, 'checkpoint'); Snd.beep(1568, 0.22, 0.1, 'checkpoint'); } catch (e) {}
      try { Wind.start(); Wind.setSpeed(60); Wind.stop(); } catch (e) {}
      try { RainSnd.update(0.5); RainSnd.thunder(); } catch (e) {}
    }
    function fonts() {
      var f = document.fonts, p = [new Promise(function (ok) { if (document.readyState === 'complete') ok(); else window.addEventListener('load', ok); })];
      if (f && f.load) p.push(f.load('40px "Luckiest Guy"'), f.load('20px "Lilita One"'));
      return Promise.all(p.map(function (x) { return Promise.resolve(x).catch(noop); }));   /* si no llegan, el juego usa la fuente de reserva */
    }
    function gpu() {   /* compila shaders y sube a la GPU las texturas de la escena */
      scene.traverse(function (o) {
        var ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
        ms.forEach(function (m) { if (m && m.map && renderer.initTexture) renderer.initTexture(m.map); });
      });
      if (renderer.initTexture) skyTexes.forEach(function (t) { renderer.initTexture(t); });
      renderer.compile(scene, camera);
    }
    function world() {   /* camino, vallas y llaves: arma una valla y una llave por delante (con el camino ya generado) para que queden compilados y en la GPU */
      updateWorld(); spawnRow(); spawnWrench();
      warmCp = { objs: [] }; ensureGen(startIdx + 35); addCheckpoint(warmCp, startIdx + 14, 1); addCheckpoint(warmCp, startIdx + 30, 4); addCheckpoint(warmCp, startIdx + 32, 60); warmCp.objs.push(addRoutePole(startIdx + 20, false).group); cps = [];   /* checkpoint y cartel de servicio compilados */
    }
    function warmTrans(a, b) {   /* transición a→b a mitad de camino: mezcla de cielo, niebla y luces ya compilada */
      atm.from = a; atm.to = b; atm.t = 0.5; atm.dirty = true;
      atmUpdate(0); updateCamera(0, 0);
      carGroup.visible = glowGroup.visible = true;
      if (PH[a].rain || PH[b].rain) { Rain2D.draw(0.016, 0, 1); RainSnd.update(0.02); }
      renderer.render(scene, camera);
    }
    function warm(i) {   /* arma el escenario i (cielo, niebla, luces, lluvia, sonidos) y dibuja un cuadro: queda todo en la GPU */
      atm.from = atm.to = i; atm.t = 1; atm.dirty = true;
      atmUpdate(0); updateCamera(0, 0);
      carGroup.visible = glowGroup.visible = true;   /* la moto y sus luces también entran en el cuadro */
      if (PH[i].rain) {
        Rain2D.draw(0.016, 0, 1); RainSnd.update(0.02);
        /* precarga del rayo: destello encendido (ambas esquinas) + luz de escena en su valor más alto, y vuelve a apagarse */
        flashEl.className = 'l r'; fl.on = true; fl.t = 0.02; atmUpdate(0); flashEl.getBoundingClientRect(); renderer.render(scene, camera);
        fl.on = false; fl.t = 0; atmUpdate(0); flashEl.className = '';
      }
      SceneAmb.update(i, i, 1, true);                 /* arma los nodos de audio del ambiente (sin sonido) */
      renderer.render(scene, camera);
    }
    function fin() {   /* reinicia la partida (escenario 1, camino limpio) y deja un cuadro listo detrás del menú */
      if (warmCp) { warmCp.objs.forEach(function (o) { scene.remove(o); }); warmCp = null; }
      reset(); Rain2D.draw(0, 0, 0); RainSnd.update(0);
      updateCamera(0, 0); renderer.render(scene, camera);
      return null;
    }
    function run(cb) {
      last = tStart = performance.now();
      var audio = startAudio(), tasks = [[W_FONT, fonts, { limit: 1500 }], [W_SND, function () { return audio; }, { quick: 1 }], [W_SFX, sfx, { quick: 1 }], [W_GPU, gpu], [W_WORLD, world]];
      onDone = cb;
      var seenS = {}, seenT = {}, aiSteps = DifficultyAI.steps();
      aiSteps.forEach(function (fn) { tasks.push([W_AI / (aiSteps.length + 1), fn]); });   /* (vacío si el plan viene precalculado) */   /* la IA calcula la dificultad de los 15 niveles con la física real */
      tasks.push([W_AI / (aiSteps.length + 1), function () { try { window.MM_DIFFICULTY = DifficultyAI.table(); } catch (e) {} }, { quick: 1 }]);
      PH.forEach(function (p, i) { if (!seenS[p.tex]) { seenS[p.tex] = 1; tasks.push([W_SCN, function () { warm(i); }]); } });   /* los 5 escenarios distintos */
      PH.forEach(function (p, i) { var q = PH[i + 1]; if (!q) return; var key = p.tex + '>' + q.tex; if (!seenT[key]) { seenT[key] = 1; tasks.push([W_TR, function () { warmTrans(i, i + 1); }]); } });   /* y sus transiciones distintas */
      tasks.push([W_END, fin]);
      requestAnimationFrame(tick);
      setTimeout(function () { real = 100; }, 20000 + LOAD_MIN_S * 1000);   /* seguro: si algo se cuelga, no se queda en la carga */
      tasks.reduce(function (chain, t) {
        return chain.then(function () {
          if (done) return;   /* la carga ya terminó: ninguna tarea tardía puede tocar la partida */
          var o = t[2] || {}, tm, limit = new Promise(function (ok) { tm = setTimeout(ok, o.limit || 4000); });
          return Promise.race([Promise.resolve().then(t[1]), limit]).catch(noop).then(function () {
            clearTimeout(tm);
            real = Math.min(100, real + t[0]);
            if (o.quick) return;   /* tarea liviana: sin pausa para pintar */
            return new Promise(function (ok) { requestAnimationFrame(function () { setTimeout(ok, 0); }); });   /* deja pintar la barra */
          });
        });
      }, Promise.resolve());
    }
    return { run: run };
  })();

  /* Al abrir: enseguida se activa el audio y arranca la carga */
  setTimeout(function () {
    Snd.init();
    Loader.run(function () { markReady(); requestAnimationFrame(frame); });
  }, 120);
})();
</script>
</body>
